name: Build Napstr desktop and Napstrfy Android installers

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create (v0.1.0 or v0.1.5-rc1); leave empty for macOS test installers
        required: false
        type: string
  push:
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    name: Napstr ${{ matrix.platform }}
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --verbose --bundles appimage,deb
            tor_platform: linux
            no_strip: '1'
            tor_url: https://archive.torproject.org/tor-package-archive/torbrowser/15.0.20/tor-expert-bundle-linux-x86_64-15.0.20.tar.gz
            tor_sha256: 3b39a2a7fbf43ef28b9ae0a6afca02a12935232f81769e4fef7472d6b5676eaf
          - platform: windows-latest
            args: --bundles nsis
            tor_platform: windows
            tor_url: https://archive.torproject.org/tor-package-archive/torbrowser/15.0.20/tor-expert-bundle-windows-x86_64-15.0.20.tar.gz
            tor_sha256: d59bff934e3ad876e1623e24ae60c19aeea56f50178093b9f86fba230639f949
          - platform: macos-15-intel
            tor_platform: macos
            mac_arch: x86_64
          - platform: macos-15
            tor_platform: macos
            mac_arch: arm64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must look like v0.1.0 or v0.1.5-rc1" >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set and verify version from release tag
        run: node scripts/set-release-version.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-15' && 'aarch64-apple-darwin' || '' }}
      - name: Verify native macOS runner
        if: runner.os == 'macOS'
        run: test "$(uname -m)" = '${{ matrix.mac_arch }}'
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            gstreamer1.0-alsa \
            gstreamer1.0-libav \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-tools \
            libasound2-dev \
            libasound2-plugins \
            libayatana-appindicator3-dev \
            libgirepository1.0-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            wget \
            xauth \
            xvfb
      - run: npm ci
      - name: Verify release version remains synchronized
        run: node scripts/set-release-version.mjs --check
      - name: Verify interface
        run: npm run check
      - name: Test native core
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Test macOS release helper
        if: runner.os == 'macOS'
        run: node --test tests/macos-release.test.mjs
      - name: Add pinned Tor Expert Bundle
        if: runner.os != 'macOS'
        shell: bash
        run: bash scripts/prepare-tor.sh '${{ matrix.tor_platform }}' '${{ matrix.tor_url }}' '${{ matrix.tor_sha256 }}'
      - uses: tauri-apps/tauri-action@v1
        if: runner.os != 'macOS'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Do not let linuxdeploy strip the bundled, already-built Tor runtime.
          NO_STRIP: ${{ matrix.no_strip }}
          # Tor's Expert Bundle libraries are intentionally adjacent to the Tor
          # executable and are not installed into Ubuntu's global library path.
          LD_LIBRARY_PATH: ${{ matrix.tor_platform == 'linux' && format('{0}/src-tauri/resources/tor/linux/tor', github.workspace) || '' }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Napstr ${{ env.RELEASE_TAG }}
          releaseBody: |
            Cross-platform Napstr desktop installers.

            Release macOS DMGs are Developer ID signed, notarized, and stapled. SHA-256 checksums accompany the macOS installers.
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          args: ${{ matrix.args }}
      - name: Repair and smoke-test Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          appimage="$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          if [[ -z "$appimage" ]]; then
            echo "Tauri did not produce an AppImage" >&2
            exit 1
          fi

          bash scripts/postprocess-appimage.sh "$appimage"

          smoke_log="$RUNNER_TEMP/napstr-appimage-smoke.log"
          set +e
          timeout 15s xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" >"$smoke_log" 2>&1
          smoke_status=$?
          set -e
          cat "$smoke_log"

          if grep -Eqi 'EGL_BAD_PARAMETER|Unable to spawn|error while loading shared libraries' "$smoke_log"; then
            echo "The AppImage hit a known graphics, WebKit, or library startup failure" >&2
            exit 1
          fi
          if [[ "$smoke_status" -ne 124 ]]; then
            echo "The AppImage exited unexpectedly during its startup smoke test (status $smoke_status)" >&2
            exit 1
          fi

          # tauri-action has already uploaded the initial bundle. Replace that
          # asset with the repaired, verified AppImage under the same filename.
          gh release upload "$RELEASE_TAG" "$appimage" --clobber
      - name: Build signed and notarized macOS DMG
        if: runner.os == 'macOS'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: npm run macos-build:signed -- --ci --tag "$RELEASE_TAG"
      - name: Always clean macOS signing session
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          if [[ -f scripts/macos-release.mjs ]]; then
            node scripts/macos-release.mjs --cleanup
          fi
      - name: Upload verified macOS installer and checksum
        if: runner.os == 'macOS'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          artifacts=src-tauri/target/macos-release/signed
          (cd "$artifacts" && shasum -a 256 -c ./*.dmg.sha256)
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            create_args=(release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "Napstr $RELEASE_TAG" --notes "Napstr and Napstrfy installers. Release macOS DMGs are Developer ID signed, notarized, and stapled.")
            if [[ "$RELEASE_TAG" == *-* ]]; then
              create_args+=(--prerelease)
            fi
            gh "${create_args[@]}" || gh release view "$RELEASE_TAG" >/dev/null
          fi
          gh release upload "$RELEASE_TAG" "$artifacts"/*.dmg "$artifacts"/*.dmg.sha256 --clobber

  macos_test:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.release_tag == '') ||
      (github.event_name == 'pull_request' &&
       startsWith(github.event.pull_request.title, '[build]') &&
       (github.event.action != 'edited' || github.event.changes.title != null))
    name: Napstr ${{ matrix.name }}
    env:
      MACOS_BUILD_MODE: >-
        ${{ (github.event_name == 'workflow_dispatch' ||
             (github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              github.event.pull_request.user.login != 'dependabot[bot]' &&
              github.actor != 'dependabot[bot]')) && 'signed' || 'unsigned' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-Intel
            runner: macos-15-intel
            arch: x86_64
          - name: macOS-Apple-Silicon
            runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native macOS runner
        run: test "$(uname -m)" = '${{ matrix.arch }}'
      - run: npm ci
      - name: Verify interface
        run: npm run check
      - name: Test JavaScript and macOS release helper
        run: npm run test:unit
      - name: Test native core
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build community macOS DMG for fork or Dependabot pull requests
        if: env.MACOS_BUILD_MODE == 'unsigned'
        run: npm run macos-build
      - name: Build signed and notarized macOS DMG
        if: env.MACOS_BUILD_MODE == 'signed'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: npm run macos-build:signed -- --ci
      - name: Always clean macOS signing session
        if: always()
        run: |
          if [[ -f scripts/macos-release.mjs ]]; then
            node scripts/macos-release.mjs --cleanup
          fi
      - name: Verify installer checksums
        run: |
          cd "src-tauri/target/macos-release/$MACOS_BUILD_MODE"
          shasum -a 256 -c ./*.dmg.sha256
      - name: Upload verified installer and checksum
        uses: actions/upload-artifact@v4
        with:
          name: Napstr-${{ matrix.name }}-${{ env.MACOS_BUILD_MODE }}
          path: |
            src-tauri/target/macos-release/${{ env.MACOS_BUILD_MODE }}/*.dmg
            src-tauri/target/macos-release/${{ env.MACOS_BUILD_MODE }}/*.dmg.sha256
          if-no-files-found: error

  android:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    name: Build Napstrfy Android APK
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      NAPSTRFY_ANDROID_RELEASE_SIGNING: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must look like v0.1.0 or v0.1.5-rc1" >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: android/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0 ndk;29.0.13846066
      - name: Configure Android NDK
        shell: bash
        run: |
          ndk="$ANDROID_HOME/ndk/29.0.13846066"
          if [[ ! -d "$ndk" ]]; then
            echo "Pinned Android NDK was not installed at $ndk" >&2
            exit 1
          fi
          echo "NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Set and verify version from release tag
        run: node scripts/set-release-version.mjs
      - name: Install Napstrfy dependencies
        working-directory: android
        run: npm ci
      - name: Verify Napstrfy interface
        working-directory: android
        run: npm run check
      - name: Generate Android project
        working-directory: android
        run: npm run android:init
      - name: Configure stable Android release signing
        shell: bash
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          if [[ -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" || -z "$ANDROID_KEY_BASE64" ]]; then
            echo "Napstrfy release signing secrets are missing." >&2
            echo "Add ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, and ANDROID_KEY_BASE64 in repository Actions secrets." >&2
            exit 1
          fi

          keystore="$RUNNER_TEMP/napstrfy-release.jks"
          printf '%s' "$ANDROID_KEY_BASE64" | base64 --decode > "$keystore"
          keytool -list \
            -keystore "$keystore" \
            -storepass "$ANDROID_KEY_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

          properties="android/src-tauri/gen/android/keystore.properties"
          printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS" > "$properties"
          printf 'password=%s\n' "$ANDROID_KEY_PASSWORD" >> "$properties"
          printf 'storeFile=%s\n' "$keystore" >> "$properties"
      - name: Build signed universal APK
        working-directory: android
        run: npm run android:build -- --apk
      - name: Verify and upload Napstrfy APK
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk="$(find android/src-tauri/gen/android/app/build/outputs/apk/universal/release \
            -maxdepth 1 -type f -name '*.apk' ! -name '*unsigned*' -print -quit)"
          if [[ -z "$apk" ]]; then
            echo "Tauri did not produce a signed universal release APK" >&2
            exit 1
          fi

          build_tools="$ANDROID_HOME/build-tools/35.0.0"
          "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          "$build_tools/zipalign" -c -P 16 4 "$apk"

          apk_files="$RUNNER_TEMP/napstrfy-apk-files.txt"
          jar tf "$apk" > "$apk_files"
          for abi in arm64-v8a armeabi-v7a x86 x86_64; do
            if ! grep -Fxq "lib/$abi/libnostrfy_lib.so" "$apk_files"; then
              echo "APK is missing the Napstrfy native library for $abi" >&2
              exit 1
            fi
          done

          release_version="${RELEASE_TAG#v}"
          badging="$("$build_tools/aapt" dump badging "$apk")"
          if [[ "$badging" != *"versionName='$release_version'"* ]]; then
            echo "APK version does not match $RELEASE_TAG" >&2
            exit 1
          fi

          asset="$RUNNER_TEMP/Napstrfy_${release_version}_android.apk"
          cp "$apk" "$asset"

          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            create_args=(release create "$RELEASE_TAG" --target "$GITHUB_SHA" --draft --title "Napstr $RELEASE_TAG" --notes "Cross-platform Napstr desktop installers and the Napstrfy Android companion.")
            if [[ "$RELEASE_TAG" == *-* ]]; then
              create_args+=(--prerelease)
            fi
            gh "${create_args[@]}" || gh release view "$RELEASE_TAG" >/dev/null
          fi

          gh release upload "$RELEASE_TAG" "$asset" --clobber
