name: UI and localization checks

on:
  pull_request:
    paths:
      - 'src/**'
      - 'android/src/**'
      - 'shared/i18n/**'
      - 'website/**'
      - 'tests/**'
      - 'scripts/i18n.mjs'
      - '**/package*.json'
      - 'playwright.config.ts'
      - '.github/workflows/localization.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            android/package-lock.json
      - run: npm ci
      - run: npm ci --prefix android
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run check --prefix android
      - run: npm test
      - run: npm run build
      - run: npm run build --prefix android
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          retention-days: 7
