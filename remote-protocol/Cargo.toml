[package]
name = "napstr-remote-protocol"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Small shared wire format for Napstr and Napstrfy"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The shared shuffle key. Both a computer sorting its own library and a phone
# merging what several computers sent have to arrive at the same key, so it is
# computed in the one place they both build from.
sha2 = "0.10"
