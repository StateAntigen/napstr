<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Napstr Link</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f0f0f0;
            --text-muted: #a0a0a0;
            --accent-color: #1db954; /* Green accent */
            --accent-hover: #1ed760;
            --btn-secondary: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 32px 24px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        }

        .icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.4;
            margin-bottom: 24px;
        }

        .hash-box {
            background-color: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 10px 12px;
            font-family: monospace;
            font-size: 0.8rem;
            color: #88c0d0;
            word-break: break-all;
            margin-bottom: 24px;
            user-select: all;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.1s;
            margin-bottom: 12px;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #000000;
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        .btn-secondary {
            background-color: var(--btn-secondary);
            color: var(--text-color);
        }

        .status {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 16px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="icon">🎵</div>
        <h1>Opening in Napstr</h1>
        <p id="description">Redirecting to your app...</p>

        <div id="hash-container" class="hash-box hidden"></div>

        <!-- Fallback button if the browser blocks automatic intent launches -->
        <a id="open-btn" class="btn btn-primary" href="#">Open in App</a>
        
        <button id="copy-btn" class="btn btn-secondary hidden" onclick="copyHash()">Copy Hash</button>

        <div id="status" class="status">Attempting launch...</div>
    </div>

    <script>
        (function() {
            // 1. Extract hash from location without sending anything to a server
            const rawFragment = window.location.hash.replace(/^#/, '').trim();
            const openBtn = document.getElementById('open-btn');
            const hashBox = document.getElementById('hash-container');
            const copyBtn = document.getElementById('copy-btn');
            const status = document.getElementById('status');
            const desc = document.getElementById('description');

            if (!rawFragment) {
                desc.textContent = "No track hash was found in the link.";
                openBtn.classList.add('hidden');
                status.textContent = "Please verify the link format: /#<sha256>";
                return;
            }

            // Display hash & reveal UI
            hashBox.textContent = rawFragment;
            hashBox.classList.remove('hidden');
            copyBtn.classList.remove('hidden');

            // 2. Build the custom URI scheme
            // Result: napstr://track/<sha256>
            const customUri = `napstr://track/${encodeURIComponent(rawFragment)}`;
            openBtn.href = customUri;

            // 3. Attempt immediate automatic redirect
            window.location.href = customUri;

            // 4. Update status if user stays on the page (meaning browser blocked auto-redirect or app isn't installed)
            setTimeout(() => {
                status.textContent = "Tap 'Open in App' if nothing happened.";
            }, 1500);
        })();

        function copyHash() {
            const rawFragment = window.location.hash.replace(/^#/, '').trim();
            if (rawFragment) {
                navigator.clipboard.writeText(rawFragment).then(() => {
                    const copyBtn = document.getElementById('copy-btn');
                    copyBtn.textContent = "Copied!";
                    setTimeout(() => { copyBtn.textContent = "Copy Hash"; }, 2000);
                });
            }
        }
    </script>
</body>
</html>
